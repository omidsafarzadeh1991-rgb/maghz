name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check lesson file
        run: python3 -c "import json;d=json.load(open('app/src/main/assets/content.json',encoding='utf-8'));assert d['rev']>0 and d['lessons'];print('rev',d['rev'],'lessons',len(d['lessons']))"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.9"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          touch build.log
          grep -E "^e: |error:|What went wrong|Could not|Exception|FAILURE|> " build.log | grep -v "^> Task" | head -45 | while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            echo "::error::${line:0:900}"
          done

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/maghz-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maghz-apk
          path: out/*.apk

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: maghz-apk
          path: out

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: build-${{ github.run_number }}
          name: کتابخانه مغزها — نسخه ${{ github.run_number }}
          make_latest: "true"
          body: "طراحی و توسعه: امید صفرزاده\n\nفایل APK را روی گوشی دانلود و نصب کنید. نسخه‌ی جدید روی نسخه‌ی قبلی نصب می‌شود و پیشرفت خواندن و نشان‌ها حفظ می‌شود. لازم نیست هر روز APK جدید نصب کنید: خود اپ هر وقت اینترنت باشد درس‌های تازه را می‌گیرد."
          files: out/*.apk
