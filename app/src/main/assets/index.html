<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>کتابخانه مغزها</title>
<style>
@font-face{font-family:"Vaz";src:url("fonts/vazirmatn_regular.ttf") format("truetype");font-weight:400}
@font-face{font-family:"Vaz";src:url("fonts/vazirmatn_bold.ttf") format("truetype");font-weight:700}
@font-face{font-family:"Vaz";src:url("fonts/vazirmatn_extrabold.ttf") format("truetype");font-weight:800}
/* Layout: phone-first library. Home = what's new + the shelf of brains; a brain opens into its folders; a folder into lessons; a lesson into a reader. Bottom bar for home / search / saved / settings. */
:root{
  --bg:#eef0f4;--surface:#fff;--surface-2:#f4f6f9;--line:#dde2ea;
  --fg:#161b22;--muted:#5d6675;--accent:#6b4bd8;--accent-soft:#ece7fd;--accent-ink:#fff;
  --good:#2e8b57;--new:#c2410c;--code-bg:#0f1720;--code-fg:#dbe4ef;--mark:#fff1a8;
  --fs:16px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1117;--surface:#161c24;--surface-2:#1c232d;--line:#2a3340;
  --fg:#e7ecf2;--muted:#93a0b0;--accent:#9b7bf0;--accent-soft:#251d44;--accent-ink:#140a2e;
  --good:#5cc08a;--new:#f08a4b;--code-bg:#0a0f15;--code-fg:#dbe4ef;--mark:#5b4a12;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Vaz",Tahoma,sans-serif;line-height:1.8;font-size:var(--fs)}
button{font:inherit;color:inherit}
a{color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(84px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;gap:10px;min-height:44px;margin-bottom:10px}
.top h1{font-size:1.45em;font-weight:800;margin:0;line-height:1.2;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sub{font-size:.72em;color:var(--muted);font-weight:400;display:block}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.sec-t{font-size:.8em;color:var(--muted);font-weight:700;margin:18px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.35em;font-weight:800;line-height:1.2}
.stat span{font-size:.72em;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.brain{display:flex;flex-direction:column;gap:8px;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;min-width:0}
.brain .badge{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.2em}
.brain .nm{font-weight:800;font-size:.95em;line-height:1.35}
.brain .en{font-size:.7em;color:var(--muted);display:block;font-weight:400}
.prog{height:5px;border-radius:5px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;border-radius:5px}
.brain .meta{font-size:.72em;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;text-align:right;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;min-width:0}
.row .tx{flex:1;min-width:0}
.row .t{font-weight:700;font-size:.95em;line-height:1.45;display:block}
.row .m{font-size:.74em;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.row .n{font-size:.8em;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.done{color:var(--good);font-weight:700}
.tag-new{color:var(--new);font-weight:800}
.chev{color:var(--muted);flex:none}
.hero{display:flex;gap:12px;align-items:center}
.hero .badge{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.5em;flex:none}
.crumb{font-size:.78em;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumb button{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:1em}
.reader h2{font-size:1.35em;font-weight:800;line-height:1.45;margin:6px 0 4px}
.md{min-width:0;overflow-wrap:anywhere}
.md h3,.md h4,.md h5{font-weight:800;margin:20px 0 6px;line-height:1.5}
.md h3{font-size:1.18em}.md h4{font-size:1.08em}.md h5{font-size:1em}
.md p{margin:0 0 12px}
.md ul,.md ol{margin:0 0 12px;padding-inline-start:22px}
.md li{margin:4px 0}
.md blockquote{margin:0 0 12px;padding:6px 12px;border-inline-start:4px solid var(--accent);background:var(--accent-soft);border-radius:8px}
.md pre{direction:ltr;text-align:left;background:var(--code-bg);color:var(--code-fg);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8em;line-height:1.6;padding:12px;border-radius:12px;overflow-x:auto;margin:10px 0 14px;position:relative}
.md pre .cp{position:absolute;top:6px;right:6px;font-family:"Vaz",sans-serif;font-size:11px;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:7px;padding:2px 9px;cursor:pointer}
.md code.inl{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85em;background:var(--surface-2);border:1px solid var(--line);padding:0 5px;border-radius:6px;direction:ltr;unicode-bidi:isolate}
.md .tbl{overflow-x:auto;margin:0 0 14px}
.md table{border-collapse:collapse;font-size:.85em;min-width:100%}
.md th,.md td{border:1px solid var(--line);padding:6px 9px;text-align:right;vertical-align:top}
.md th{background:var(--surface-2)}
.md hr{border:0;border-top:1px dashed var(--line);margin:16px 0}
.src{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);font-size:.8em;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:.9em}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.55}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.pager button{text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;min-width:0}
.pager small{display:block;color:var(--muted);font-size:.72em}
.pager span{display:block;font-size:.85em;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 12px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--fg);padding:9px 0;outline:none}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.snip{font-size:.8em;color:var(--muted);display:block;margin-top:2px;line-height:1.6}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;font-size:.78em;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.empty{color:var(--muted);text-align:center;padding:28px 12px;font-size:.9em}
.set{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line)}
.set:last-child{border-bottom:0}
.set .k{font-weight:700;font-size:.92em}
.set .d{font-size:.75em;color:var(--muted);display:block;font-weight:400}
.fsz{display:flex;gap:6px}
.fsz button{width:40px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:800}
nav.bar{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));z-index:10}
nav.bar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7em;color:var(--muted);padding:4px;cursor:pointer}
nav.bar button svg{width:22px;height:22px}
nav.bar button[aria-current="page"]{color:var(--accent);font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:.85em;z-index:20;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.upd{display:flex;align-items:center;gap:8px;font-size:.78em;color:var(--muted);margin-top:8px}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<main id="view"></main>
<nav class="bar" id="bar">
  <button data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>خانه</button>
  <button data-nav="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>جست‌وجو</button>
  <button data-nav="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>نشان‌شده</button>
  <button data-nav="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="8" cy="18" r="2" fill="currentColor"/></svg>تنظیمات</button>
</nav>

<script>
(function(){
"use strict";
var FA="۰۱۲۳۴۵۶۷۸۹";
function fa(n){return String(n).replace(/\d/g,function(d){return FA[d];});}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function $(id){return document.getElementById(id);}
var NATIVE=!!window.Android;

/* ---------- persistent per-phone state ---------- */
function lsGet(k,def){try{var v=localStorage.getItem("mz."+k);return v==null?def:JSON.parse(v);}catch(e){return def;}}
function lsSet(k,v){try{localStorage.setItem("mz."+k,JSON.stringify(v));}catch(e){}}
var READ=lsGet("read",{}), SAVED=lsGet("saved",{}), LAST=lsGet("last",null), SEEN_REV=lsGet("seenRev",0);
var FS=lsGet("fs",16);document.documentElement.style.setProperty("--fs",FS+"px");

/* ---------- content ---------- */
var C={rev:0,brains:[],lessons:[]}, BY={}, BRAIN={}, NEWSET={};
function index(){
  BY={};BRAIN={};
  C.brains.forEach(function(b){BRAIN[b.id]=b;BY[b.id]=[];});
  C.lessons.forEach(function(l){if(!BY[l.brain]){BY[l.brain]=[];}BY[l.brain].push(l);});
  // "new" = arrived in the last 3 content days or unread and recent
  var dates=C.lessons.map(function(l){return l.date;}).filter(Boolean).sort();
  var cutoff=dates.length?dates[Math.max(0,dates.length-1)]:"";
  var uniq=[];dates.forEach(function(d){if(uniq[uniq.length-1]!==d)uniq.push(d);});
  var recent=uniq.slice(-2);
  NEWSET={};C.lessons.forEach(function(l){if(recent.indexOf(l.date)>=0&&!READ[l.id])NEWSET[l.id]=1;});
}
function loadContent(){
  if(NATIVE){try{C=JSON.parse(window.Android.getContent());}catch(e){C={rev:0,brains:[],lessons:[]};}index();return Promise.resolve();}
  return fetch("content.json").then(function(r){return r.json();}).then(function(j){C=j;index();}).catch(function(){index();});
}
function lessonById(id){for(var i=0;i<C.lessons.length;i++)if(C.lessons[i].id===id)return C.lessons[i];return null;}
function foldersOf(bid){var b=BRAIN[bid];var f=(b&&b.folders||[]).slice();(BY[bid]||[]).forEach(function(l){if(f.indexOf(l.folder)<0)f.push(l.folder);});return f;}
function inFolder(bid,folder){return (BY[bid]||[]).filter(function(l){return l.folder===folder;});}
function readCount(arr){return arr.filter(function(l){return READ[l.id];}).length;}
function faDate(d){if(!d)return "";var p=d.split("-");return fa(p[2]+"/"+p[1]);}

/* ---------- markdown (small, safe: everything escaped first) ---------- */
function inl(s){
  return esc(s)
    .replace(/`([^`]+)`/g,'<code class="inl">$1</code>')
    .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" data-ext="1">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" data-ext="1">$2</a>')
    .replace(/^\[ \]\s/,"☐ ").replace(/^\[x\]\s/i,"☑ ");
}
function md(src){
  var out="",parts=String(src||"").split("```");
  for(var k=0;k<parts.length;k++){
    var p=parts[k];
    if(k%2===1){var nl=p.indexOf("\n");var code=nl>=0?p.slice(nl+1):p;out+='<pre><button class="cp" data-copycode>کپی</button><code>'+esc(code.replace(/\n$/,""))+"</code></pre>";continue;}
    var lines=p.split("\n"),para=[],list=null,listType="",tbl=[];
    var flushP=function(){if(para.length){out+="<p>"+para.join("<br>")+"</p>";para=[];}};
    var flushL=function(){if(list){out+="<"+listType+">"+list.map(function(x){return "<li>"+x+"</li>";}).join("")+"</"+listType+">";list=null;}};
    var flushT=function(){if(tbl.length){var rows=tbl.filter(function(r){return !/^\s*\|?\s*:?-{2,}/.test(r);});
      var h='<div class="tbl"><table>';rows.forEach(function(r,i){var cells=r.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|");
        h+="<tr>"+cells.map(function(c){return (i===0?"<th>":"<td>")+inl(c.trim())+(i===0?"</th>":"</td>");}).join("")+"</tr>";});
      out+=h+"</table></div>";tbl=[];}};
    for(var i=0;i<lines.length;i++){
      var t=lines[i].trim();
      if(/^\|.*\|$/.test(t)){flushP();flushL();tbl.push(t);continue;}else flushT();
      if(!t){flushP();flushL();continue;}
      var m;
      if((m=t.match(/^(#{1,6})\s+(.*)$/))){flushP();flushL();var lv=Math.min(5,Math.max(3,m[1].length+1));out+="<h"+lv+">"+inl(m[2])+"</h"+lv+">";continue;}
      if(/^(-{3,}|\*{3,})$/.test(t)){flushP();flushL();out+="<hr>";continue;}
      if((m=t.match(/^>\s?(.*)$/))){flushP();flushL();out+="<blockquote>"+inl(m[1])+"</blockquote>";continue;}
      if((m=t.match(/^[-*]\s+(.*)$/))){flushP();if(listType!=="ul")flushL();listType="ul";(list=list||[]).push(inl(m[1]));continue;}
      if((m=t.match(/^\d+[.)]\s+(.*)$/))){flushP();if(listType!=="ol")flushL();listType="ol";(list=list||[]).push(inl(m[1]));continue;}
      flushL();para.push(inl(t));
    }
    flushP();flushL();flushT();
  }
  return out;
}

/* ---------- icons ---------- */
var IC={
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  chev:'<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
  refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>',
  bm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
  bmOn:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>'
};

/* ---------- routing (hash = Android back button works) ---------- */
function go(h){if(location.hash==="#"+h)render();else location.hash=h;}
window.addEventListener("hashchange",render);
function route(){var h=(location.hash||"#home").slice(1).split("/").map(decodeURIComponent);return h;}

var updating=false, lastUpdMsg="";
function render(){
  var r=route(), v=$("view"), html="";
  var tab=r[0]==="search"?"search":r[0]==="saved"?"saved":r[0]==="settings"?"settings":"home";
  document.querySelectorAll("nav.bar button").forEach(function(b){if(b.dataset.nav===tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});
  if(r[0]==="b"&&BRAIN[r[1]]){html=r.length>2?viewFolder(r[1],r[2]):viewBrain(r[1]);}
  else if(r[0]==="l"&&lessonById(r[1])){html=viewLesson(r[1]);}
  else if(r[0]==="search"){html=viewSearch(r[1]||"");}
  else if(r[0]==="saved"){html=viewSaved();}
  else if(r[0]==="settings"){html=viewSettings();}
  else html=viewHome();
  v.innerHTML=html;
  window.scrollTo(0,0);
  if(r[0]==="search"){var q=$("q");if(q){q.focus();var L=q.value.length;try{q.setSelectionRange(L,L);}catch(e){}}}
}

function topBar(title,sub,back){
  return '<div class="top">'+(back?'<button class="iconbtn" data-back aria-label="بازگشت">'+IC.back+"</button>":"")+
    "<h1>"+esc(title)+(sub?'<span class="sub">'+sub+"</span>":"")+"</h1>"+
    (!back?'<button class="iconbtn" data-update aria-label="به‌روزرسانی درس‌ها">'+(updating?'<span class="spin"></span>':IC.refresh)+"</button>":"")+"</div>";
}
function lessonRow(l,opts){
  opts=opts||{};var b=BRAIN[l.brain]||{color:"#888",name:l.brain};
  return '<button class="row" data-open="'+esc(l.id)+'"><span class="dot" style="background:'+b.color+'"></span><span class="tx"><span class="t">'+(opts.hl?hl(l.title,opts.hl):esc(l.title))+"</span>"+
    (opts.snip?'<span class="snip">'+opts.snip+"</span>":"")+
    '<span class="m">'+(opts.showBrain?"<span>"+esc(b.name)+" › "+esc(l.folder)+"</span>":"<span>"+esc(l.folder)+"</span>")+
    "<span>"+faDate(l.date)+"</span>"+(READ[l.id]?'<span class="done">خوانده شد</span>':NEWSET[l.id]?'<span class="tag-new">تازه</span>':"")+"</span></span>"+IC.chev+"</button>";
}

/* ---------- views ---------- */
function viewHome(){
  var total=C.lessons.length, read=readCount(C.lessons), nw=Object.keys(NEWSET).length;
  var h=topBar("کتابخانه مغزها","آخرین به‌روزرسانی: "+faDate(C.updated||""),false);
  h+='<div class="stats"><div class="stat"><b>'+fa(total)+'</b><span>درس</span></div><div class="stat"><b>'+fa(read)+'</b><span>خوانده‌شده</span></div><div class="stat"><b>'+fa(nw)+'</b><span>تازه</span></div></div>';
  if(lastUpdMsg)h+='<div class="upd">'+(updating?'<span class="spin"></span>':"")+"<span>"+esc(lastUpdMsg)+"</span></div>";
  var last=LAST&&lessonById(LAST);
  if(last){h+='<div class="sec-t">ادامه بده</div>'+lessonRow(last,{showBrain:true});}
  var fresh=C.lessons.slice().sort(function(a,b){return (b.date+b.ts).localeCompare(a.date+a.ts);}).slice(0,5);
  if(fresh.length){h+='<div class="sec-t">تازه‌ترین درس‌ها</div><div class="list">'+fresh.map(function(l){return lessonRow(l,{showBrain:true});}).join("")+"</div>";}
  h+='<div class="sec-t">مغزها</div><div class="grid">';
  C.brains.forEach(function(b){var arr=BY[b.id]||[],rd=readCount(arr),pct=arr.length?Math.round(rd/arr.length*100):0;
    h+='<button class="brain" data-brain="'+b.id+'"><span class="badge" style="background:'+b.color+'">'+esc(b.glyph)+'</span><span class="nm">'+esc(b.name)+'<span class="en">'+esc(b.en)+"</span></span>"+
      '<span class="prog"><i style="width:'+pct+"%;background:"+b.color+'"></i></span><span class="meta">'+fa(arr.length)+" درس · "+fa(foldersOf(b.id).length)+" پوشه</span></button>";});
  h+="</div>";
  if(!total)h+='<div class="empty">هنوز درسی نیامده. وقتی اینترنت داشتی دکمه‌ی به‌روزرسانی بالا را بزن.</div>';
  return h;
}
function viewBrain(bid){
  var b=BRAIN[bid],arr=BY[bid]||[],folders=foldersOf(bid);
  var h=topBar("مغز "+b.name,fa(arr.length)+" درس · "+fa(readCount(arr))+" خوانده‌شده",true);
  h+='<div class="list">';
  folders.forEach(function(f){var ls=inFolder(bid,f),rd=readCount(ls);
    h+='<button class="row" data-folder="'+esc(bid)+'" data-f="'+esc(f)+'"><span class="dot" style="background:'+b.color+(ls.length?"":";opacity:.3")+'"></span><span class="tx"><span class="t">'+esc(f)+'</span><span class="m">'+
      (ls.length?fa(ls.length)+" درس"+(rd?" · "+fa(rd)+" خوانده‌شده":""):"هنوز درسی نیامده")+"</span></span>"+IC.chev+"</button>";});
  h+="</div>";
  return h;
}
function viewFolder(bid,f){
  var b=BRAIN[bid],ls=inFolder(bid,f);
  var h=topBar(f,"مغز "+esc(b.name),true);
  h+=ls.length?'<div class="list">'+ls.map(function(l){return lessonRow(l);}).join("")+"</div>":'<div class="empty">این پوشه هنوز درسی ندارد. آموزش روزانه به‌زودی پرش می‌کند.</div>';
  return h;
}
function viewLesson(id){
  var l=lessonById(id),b=BRAIN[l.brain]||{name:l.brain,color:"#888"};
  if(!READ[id]){READ[id]=Date.now();lsSet("read",READ);delete NEWSET[id];}
  LAST=id;lsSet("last",LAST);
  var sibs=inFolder(l.brain,l.folder),i=sibs.indexOf(l),prev=sibs[i-1],next=sibs[i+1];
  var h='<div class="top"><button class="iconbtn" data-back aria-label="بازگشت">'+IC.back+'</button><div class="crumb" style="flex:1;min-width:0"><button data-brain="'+b.id+'">'+esc(b.name)+'</button>›<button data-folder="'+esc(l.brain)+'" data-f="'+esc(l.folder)+'">'+esc(l.folder)+"</button></div>"+
    '<button class="iconbtn" data-save="'+esc(id)+'" aria-label="نشان کردن" style="color:'+(SAVED[id]?"var(--accent)":"inherit")+'">'+(SAVED[id]?IC.bmOn:IC.bm)+"</button></div>";
  h+='<article class="card reader"><div class="crumb">'+faDate(l.date)+'</div><h2>'+esc(l.title)+'</h2><div class="md">'+md(stripTitle(l.body))+"</div>"+
    (l.source?'<div class="src">منبع: '+inl(l.source)+"</div>":"")+"</article>";
  h+='<div class="actions"><button class="btn ghost" data-copylesson="'+esc(id)+'">کپی کل درس</button><button class="btn ghost" data-unread="'+esc(id)+'">علامت نخوانده</button></div>';
  if(prev||next){h+='<div class="pager">'+(next?'<button data-open="'+esc(next.id)+'"><small>درس بعدی</small><span>'+esc(next.title)+"</span></button>":"<span></span>")+
    (prev?'<button data-open="'+esc(prev.id)+'"><small>درس قبلی</small><span>'+esc(prev.title)+"</span></button>":"<span></span>")+"</div>";}
  return h;
}
function stripTitle(b){return String(b||"").replace(/^\s*#{1,2}\s+[^\n]*\n+/,"");}
function norm(s){return String(s||"").toLowerCase().replace(/[يى]/g,"ی").replace(/ك/g,"ک").replace(/‌/g," ");}
function hl(text,q){var t=esc(text);if(!q)return t;var re=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");return t.replace(re,"<mark>$1</mark>");}
var searchBrain="";
function viewSearch(q){
  var h=topBar("جست‌وجو","در همه‌ی مغزها",false);
  h+='<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="مثلاً: احراز هویت، DNS، وبهوک…" value="'+esc(q)+'" autocomplete="off"></div>';
  h+='<div class="chips"><button class="chip" data-sb="" aria-pressed="'+(!searchBrain)+'">همه</button>'+C.brains.map(function(b){return '<button class="chip" data-sb="'+b.id+'" aria-pressed="'+(searchBrain===b.id)+'">'+esc(b.name)+"</button>";}).join("")+"</div>";
  h+='<div id="results" class="list" style="margin-top:12px">'+results(q)+"</div>";
  return h;
}
function results(q){
  var nq=norm(q).trim();
  if(!nq)return '<div class="empty">عنوان، کلمه یا اسم یک ابزار را بنویس.</div>';
  var hits=[];
  C.lessons.forEach(function(l){if(searchBrain&&l.brain!==searchBrain)return;
    var nt=norm(l.title),nb=norm(l.body),nf=norm(l.folder);var s=0;
    if(nt.indexOf(nq)>=0)s+=10;if(nf.indexOf(nq)>=0)s+=4;var at=nb.indexOf(nq);if(at>=0)s+=2;
    if(s){var snip="";if(at>=0){var raw=l.body.replace(/```[\s\S]*?```/g," ").replace(/[#*`>|]/g,"");var na=norm(raw).indexOf(nq);if(na>=0){snip=raw.slice(Math.max(0,na-40),na+nq.length+60).replace(/\s+/g," ");}}
      hits.push({l:l,s:s,snip:snip});}});
  hits.sort(function(a,b){return b.s-a.s;});
  if(!hits.length)return '<div class="empty">چیزی پیدا نشد. کلمه‌ی کوتاه‌تر یا مترادف امتحان کن.</div>';
  return '<div class="crumb" style="margin:0 4px">'+fa(hits.length)+" نتیجه</div>"+hits.map(function(x){return lessonRow(x.l,{showBrain:true,hl:q.trim(),snip:x.snip?"…"+hl(x.snip,q.trim())+"…":""});}).join("");
}
function viewSaved(){
  var ids=Object.keys(SAVED).filter(lessonById).sort(function(a,b){return SAVED[b]-SAVED[a];});
  var h=topBar("نشان‌شده‌ها",fa(ids.length)+" درس",false);
  h+=ids.length?'<div class="list">'+ids.map(function(id){return lessonRow(lessonById(id),{showBrain:true});}).join("")+"</div>":'<div class="empty">هر درسی که با علامت نشان بالای آن ذخیره کنی، این‌جا می‌آید.</div>';
  return h;
}
function viewSettings(){
  var ver=NATIVE&&window.Android.appVersion?window.Android.appVersion():"";
  var h=topBar("تنظیمات","",false);
  h+='<div class="card">'+
    '<div class="set"><span class="k">به‌روزرسانی از اینترنت<span class="d">درس‌های تازه را از گیت‌هاب می‌گیرد. هر بار که اپ را باز کنی و اینترنت باشد، خودکار هم انجام می‌شود.</span></span><button class="btn" data-update'+(updating?" disabled":"")+">"+(updating?"در حال بررسی…":"بررسی")+"</button></div>"+
    (NATIVE?'<div class="set"><span class="k">به‌روزرسانی از فایل<span class="d">اگر اینترنت نداری، فایل content.json را از کسی بگیر (بلوتوث، فلش، تلگرام) و این‌جا انتخابش کن.</span></span><button class="btn ghost" data-import>انتخاب فایل</button></div>':"")+
    '<div class="set"><span class="k">اندازه‌ی متن<span class="d">برای خواندن راحت‌تر</span></span><span class="fsz"><button data-fs="-1">−</button><button data-fs="1">+</button></span></div>'+
    '<div class="set"><span class="k">پیشرفت خواندن<span class="d">'+fa(readCount(C.lessons))+" از "+fa(C.lessons.length)+' درس خوانده شده</span></span><button class="btn ghost" data-resetread>صفر کن</button></div>'+
    '<div class="set"><span class="k">نسخه<span class="d">اپ '+esc(fa(ver||"—"))+" · محتوا "+fa(C.rev||0)+'</span></span></div>'+
    "</div>";
  h+='<div class="sec-t">درباره</div><div class="card" style="font-size:.85em;color:var(--muted)">هر روز درس‌های تازه به هشت مغز اضافه می‌شود: فرانت‌اند، بک‌اند، دولوپر، برنامه‌نویس، امنیت (کلاه‌سفید)، شبکه، پشتیبانی IT، اتوماسیون و n8n. همه‌ی درس‌ها داخل گوشی ذخیره می‌شوند و بدون اینترنت هم باز می‌شوند.<br>طراحی و توسعه: پیشگامان آویژه پرداز برنا (papb.ir)</div>';
  if(lastUpdMsg)h+='<div class="upd">'+esc(lastUpdMsg)+"</div>";
  return h;
}

/* ---------- updates ---------- */
function startUpdate(silent){
  if(updating)return;
  if(!NATIVE){if(!silent)toast("به‌روزرسانی فقط داخل اپ اندروید کار می‌کند");return;}
  updating=true;silentUpd=!!silent;
  if(!silent){lastUpdMsg="در حال بررسی درس‌های تازه…";render();}
  try{window.Android.checkUpdate();}catch(e){updating=false;}
}
var silentUpd=false;
function calmView(){var r=route()[0];return r==="home"||r===""||r==="settings";}
window.onUpdate=function(status,detail){
  updating=false;var wasSilent=silentUpd;silentUpd=false;
  if(status==="updated"){loadContent().then(function(){var n=parseInt(detail,10);lastUpdMsg=n>0?fa(n)+" درس تازه رسید":"کتابخانه به‌روز شد";toast(lastUpdMsg);if(!wasSilent||calmView())render();});return;}
  if(wasSilent){if(calmView()){var b=document.querySelector("[data-update]");if(b&&b.classList.contains("iconbtn"))b.innerHTML=IC.refresh;}return;}
  if(status==="same")lastUpdMsg="کتابخانه به‌روز است";
  else if(status==="offline")lastUpdMsg="اینترنت در دسترس نیست؛ همه‌ی درس‌های قبلی بدون اینترنت باز می‌شوند";
  else if(status==="import-old")lastUpdMsg="این فایل از نسخه‌ی فعلی قدیمی‌تر است";
  else if(status==="import-bad")lastUpdMsg="این فایل، فایل درس‌های کتابخانه نیست";
  else if(status==="import-cancel")lastUpdMsg="";
  if(lastUpdMsg&&status!=="offline")toast(lastUpdMsg);
  render();
};

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("button,a");if(!t)return;
  if(t.tagName==="A"&&t.dataset.ext){e.preventDefault();var u=t.getAttribute("href");if(NATIVE&&window.Android.openUrl)window.Android.openUrl(u);else window.open(u,"_blank");return;}
  var d=t.dataset;
  if(d.nav){go(d.nav==="search"?"search":d.nav);return;}
  if("back" in d){history.back();return;}
  if(d.brain){go("b/"+encodeURIComponent(d.brain));return;}
  if(d.folder){go("b/"+encodeURIComponent(d.folder)+"/"+encodeURIComponent(d.f));return;}
  if(d.open){go("l/"+encodeURIComponent(d.open));return;}
  if("update" in d){startUpdate(false);return;}
  if("import" in d){lastUpdMsg="";window.Android.importFile();return;}
  if(d.save){if(SAVED[d.save])delete SAVED[d.save];else SAVED[d.save]=Date.now();lsSet("saved",SAVED);toast(SAVED[d.save]?"نشان شد":"از نشان‌شده‌ها برداشته شد");render();return;}
  if(d.unread){delete READ[d.unread];lsSet("read",READ);toast("علامت نخوانده خورد");return;}
  if(d.copylesson){var l=lessonById(d.copylesson);copy(l.title+"\n\n"+l.body+(l.source?"\n\nمنبع: "+l.source:""));return;}
  if("copycode" in d){var code=t.parentNode.querySelector("code");copy(code?code.textContent:"");return;}
  if(d.sb!==undefined){searchBrain=d.sb;var q=$("q");$("results").innerHTML=results(q?q.value:"");document.querySelectorAll("[data-sb]").forEach(function(c){c.setAttribute("aria-pressed",c.dataset.sb===searchBrain);});return;}
  if(d.fs){FS=Math.max(13,Math.min(22,FS+parseInt(d.fs,10)));lsSet("fs",FS);document.documentElement.style.setProperty("--fs",FS+"px");return;}
  if("resetread" in d){READ={};lsSet("read",READ);index();toast("پیشرفت صفر شد");render();return;}
});
document.addEventListener("input",function(e){if(e.target.id==="q"){$("results").innerHTML=results(e.target.value);history.replaceState(null,"","#search/"+encodeURIComponent(e.target.value));}});
function copy(txt){
  if(NATIVE&&window.Android.copy){window.Android.copy(txt);toast("کپی شد");return;}
  try{navigator.clipboard.writeText(txt).then(function(){toast("کپی شد");},function(){toast("کپی نشد");});}catch(e){toast("کپی نشد");}
}
var tt;function toast(m){var x=document.querySelector(".toast");if(!x){x=document.createElement("div");x.className="toast";document.body.appendChild(x);}x.textContent=m;clearTimeout(tt);tt=setTimeout(function(){x.remove();},2600);}

/* ---------- boot ---------- */
loadContent().then(function(){
  render();
  if(C.rev>SEEN_REV){lsSet("seenRev",C.rev);}
  startUpdate(true);
});
})();
</script>
</body>
