<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>کتابخانه مغزها</title>
<!--MZ:FONTS-->
<style>
@font-face{font-family:"Vaz";src:url("fonts/vazirmatn_regular.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"Vaz";src:url("fonts/vazirmatn_bold.ttf") format("truetype");font-weight:700;font-display:swap}
@font-face{font-family:"Vaz";src:url("fonts/vazirmatn_extrabold.ttf") format("truetype");font-weight:800;font-display:swap}
/* Layout: an iOS-style library. Large titles that collapse into a frosted nav bar, inset grouped lists, app-icon brains with activity rings,
   a floating glass tab bar, and pages that push in from the leading edge and pop back the same way. */
:root{
  --bg:#f2f2f7; --bg-2:#e9e9f0;
  --glass:rgba(255,255,255,.66); --glass-strong:rgba(255,255,255,.82); --glass-edge:rgba(255,255,255,.75);
  --group:#ffffff; --sep:rgba(60,60,67,.14);
  --fg:#1c1c1e; --fg-2:#3a3a3c; --muted:#8a8a8e;
  --tint:#5e5ce6; --tint-2:#bf5af2; --tint-ink:#ffffff;
  --good:#30b158; --new:#ff6a2b; --mark:#ffe873;
  --code-bg:#1c1c1e; --code-fg:#e5e5ea;
  --shadow:0 10px 30px -12px rgba(30,30,60,.25), 0 2px 6px -2px rgba(30,30,60,.08);
  --shadow-lg:0 24px 60px -20px rgba(30,30,80,.35), 0 4px 14px -4px rgba(30,30,60,.12);
  --blob-a:#c7c2ff; --blob-b:#ffd1e8; --blob-c:#bfe9ff;
  --ease:cubic-bezier(.32,.72,0,1);
  --fs:16px;
  --font:"Vaz","Vazirmatn",-apple-system,"SF Pro Text",system-ui,Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000; --bg-2:#0b0b0f;
  --glass:rgba(38,38,44,.58); --glass-strong:rgba(44,44,50,.8); --glass-edge:rgba(255,255,255,.12);
  --group:#1c1c1e; --sep:rgba(84,84,88,.6);
  --fg:#f5f5f7; --fg-2:#d1d1d6; --muted:#8e8e93;
  --tint:#7d7aff; --tint-2:#da8fff; --tint-ink:#ffffff;
  --good:#32d74b; --new:#ff8a4c; --mark:#6b5a10;
  --code-bg:#111114; --code-fg:#e5e5ea;
  --shadow:0 10px 30px -12px rgba(0,0,0,.7), 0 2px 6px -2px rgba(0,0,0,.5);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.85), 0 4px 14px -4px rgba(0,0,0,.6);
  --blob-a:#2b2770; --blob-b:#5a1f45; --blob-c:#0f3a55;
  color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;direction:rtl;text-align:right;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:var(--fs);line-height:1.75;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
a{color:var(--tint);text-decoration:none}
:focus-visible{outline:2.5px solid var(--tint);outline-offset:2px;border-radius:10px}

.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ambient i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75}
.ambient i:nth-child(1){width:60vmax;height:60vmax;background:var(--blob-a);top:-25vmax;right:-20vmax}
.ambient i:nth-child(2){width:45vmax;height:45vmax;background:var(--blob-b);top:35vh;left:-22vmax}
.ambient i:nth-child(3){width:50vmax;height:50vmax;background:var(--blob-c);bottom:-30vmax;right:-10vmax}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);
  border:1px solid var(--glass-edge);box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.45)}
@media (prefers-color-scheme:dark){.glass{box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.08)}}
@media (prefers-reduced-transparency:reduce){.glass{background:var(--glass-strong);-webkit-backdrop-filter:none;backdrop-filter:none}}

.navbar{position:fixed;top:0;inset-inline:0;z-index:20;height:calc(52px + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));
  display:grid;grid-template-columns:96px 1fr 96px;align-items:center;pointer-events:none}
.navbar::before{content:"";position:absolute;inset:0;background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);
  border-bottom:.5px solid var(--sep);opacity:0;transition:opacity .25s ease}
.navbar.solid::before{opacity:1}
.navbar>*{position:relative;pointer-events:auto}
.navbar .ntitle{text-align:center;font-weight:700;font-size:1.02em;opacity:0;transform:translateY(4px);transition:opacity .25s ease,transform .35s var(--ease);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbar.solid .ntitle{opacity:1;transform:none}
.navbar .side{display:flex;gap:8px}
.navbar .side.end{justify-content:flex-end}

.gbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--tint);position:relative;overflow:hidden;
  transition:transform .35s var(--ease),background-color .2s}
.gbtn svg{width:20px;height:20px}
.gbtn.on{color:#fff;background:linear-gradient(140deg,var(--tint),var(--tint-2))}
.press{transition:transform .45s var(--ease)}
.press.down,.press:active{transform:scale(.95);transition:transform .12s ease-out}

main{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:calc(56px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.page.push{animation:pushIn .5s var(--ease) both}
.page.pop{animation:popIn .5s var(--ease) both}
.page.fade{animation:fadeIn .35s ease both}
@keyframes pushIn{from{transform:translateX(-34%);opacity:0}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:translateX(26%);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page.push,.page.pop,.page.fade{animation:fadeIn .2s ease both}.press.down,.press:active{transform:none}}

.large{margin:4px 2px 14px}
.large h1{font-size:2.05em;font-weight:800;line-height:1.15;letter-spacing:-.02em;margin:0;text-wrap:balance}
.large .cap{font-size:.82em;color:var(--muted);margin-top:4px}
.eyebrow{font-size:.74em;font-weight:700;color:var(--tint);letter-spacing:.02em;margin-bottom:2px;display:flex;gap:6px;align-items:center}
.sh{font-size:.8em;font-weight:700;color:var(--muted);margin:22px 16px 8px;display:flex;justify-content:space-between;align-items:center}

.hero{border-radius:26px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:84px;height:84px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .lbl b{font-size:1.25em;font-weight:800;letter-spacing:-.02em}
.ring .lbl span{font-size:.62em;color:var(--muted);display:block}
.hero .facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.fact{text-align:center}
.fact b{display:block;font-size:1.3em;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.3}
.fact span{font-size:.7em;color:var(--muted)}
.fact.n b{color:var(--new)}
.hero .status{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:.78em;color:var(--muted);border-top:.5px solid var(--sep);padding-top:10px;margin-top:-2px}
.hero .status .pulse{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 2.4s infinite;flex:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.hero .status .pulse{animation:none}}

.icons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 10px;padding:16px 10px;border-radius:26px}
@media (max-width:360px){.icons{grid-template-columns:repeat(3,minmax(0,1fr))}}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.squircle{width:62px;height:62px;border-radius:30%;display:grid;place-items:center;position:relative;color:#fff;font-weight:800;font-size:1.45em;
  box-shadow:0 8px 18px -8px var(--c,#555), inset 0 1px 0 rgba(255,255,255,.35)}
.squircle::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.42),rgba(255,255,255,0) 52%)}
.squircle .g{position:relative;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.squircle .badge{position:absolute;top:-6px;left:-6px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--new);color:#fff;font-size:11.5px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2.5px var(--bg)}
.app .nm{font-size:.74em;font-weight:700;text-align:center;line-height:1.3;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app .ct{font-size:.66em;color:var(--muted);margin-top:-6px}

.group{border-radius:22px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:12px 16px;position:relative;min-height:56px;transition:background-color .2s}
.cell+.cell::before{content:"";position:absolute;top:0;inset-inline-start:60px;inset-inline-end:0;border-top:.5px solid var(--sep)}
.cell.down,button.cell:active{background:color-mix(in srgb,var(--fg) 7%,transparent);transition:none}
.cell .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.9em;flex:none;position:relative;overflow:hidden}
.cell .ic::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.4),rgba(255,255,255,0) 55%)}
.cell .ic svg{width:18px;height:18px;position:relative}
.cell .ic span{position:relative}
.cell .tx{flex:1;min-width:0}
.cell .t{display:block;font-weight:700;font-size:.95em;line-height:1.45}
.cell .m{display:flex;gap:8px;flex-wrap:wrap;font-size:.74em;color:var(--muted);line-height:1.6}
.cell .v{font-size:.85em;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.cell .chev{color:color-mix(in srgb,var(--muted) 70%,transparent);flex:none;width:14px;height:14px}
.cell.empty-f .t{color:var(--muted);font-weight:500}
.newdot{width:9px;height:9px;border-radius:50%;background:var(--new);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--new) 22%,transparent)}
.done{color:var(--good);font-weight:700}

.bhead{display:flex;align-items:center;gap:14px;margin:4px 2px 16px}
.bhead .squircle{width:70px;height:70px;font-size:1.6em;flex:none}
.bhead h1{font-size:1.8em;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin:0}
.bhead .cap{font-size:.78em;color:var(--muted)}
.pbar{height:6px;border-radius:6px;background:color-mix(in srgb,var(--fg) 10%,transparent);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;border-radius:6px}

.article{border-radius:26px;padding:20px 18px}
.article .crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.76em;color:var(--muted);margin-bottom:6px}
.article .crumbs button{color:var(--tint);font-weight:700}
.article h1{font-size:1.5em;font-weight:800;letter-spacing:-.015em;line-height:1.4;margin:0 0 6px;text-wrap:balance}
.article .when{font-size:.74em;color:var(--muted)}
.md{margin-top:14px;min-width:0;overflow-wrap:anywhere;color:var(--fg-2)}
.md h3,.md h4,.md h5{color:var(--fg);font-weight:800;margin:22px 0 6px;line-height:1.5;letter-spacing:-.01em}
.md h3{font-size:1.2em}.md h4{font-size:1.08em}.md h5{font-size:1em}
.md p{margin:0 0 12px}
.md ul,.md ol{margin:0 0 12px;padding-inline-start:22px}
.md li{margin:4px 0}
.md li::marker{color:var(--tint)}
.md b{color:var(--fg)}
.md blockquote{margin:0 0 12px;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--tint) 10%,transparent)}
.md pre{direction:ltr;text-align:left;background:var(--code-bg);color:var(--code-fg);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.78em;line-height:1.65;padding:40px 14px 14px;border-radius:16px;overflow-x:auto;margin:12px 0 16px;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.md pre::before{content:"";position:absolute;top:15px;left:14px;width:10px;height:10px;border-radius:50%;background:#ff5f57;box-shadow:16px 0 0 #febc2e,32px 0 0 #28c840}
.md pre .cp{position:absolute;top:8px;right:8px;font-family:var(--font);font-size:11px;font-weight:700;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:3px 12px}
.md code.inl{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.84em;background:color-mix(in srgb,var(--fg) 8%,transparent);padding:1px 6px;border-radius:6px;direction:ltr;unicode-bidi:isolate}
.md .tbl{overflow-x:auto;margin:0 0 14px;border-radius:14px;border:.5px solid var(--sep)}
.md table{border-collapse:collapse;font-size:.84em;min-width:100%}
.md th,.md td{border-bottom:.5px solid var(--sep);padding:8px 10px;text-align:right;vertical-align:top}
.md th{background:color-mix(in srgb,var(--fg) 5%,transparent);color:var(--fg)}
.md hr{border:0;border-top:.5px solid var(--sep);margin:18px 0}
.src{margin-top:16px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--fg) 5%,transparent);font-size:.78em;color:var(--muted)}

.pills{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pill{border-radius:999px;padding:11px 18px;font-weight:700;font-size:.88em;display:inline-flex;align-items:center;gap:8px;position:relative;overflow:hidden;color:var(--fg)}
.pill svg{width:17px;height:17px;position:relative}
.pill span{position:relative}
.pill.tint{color:var(--tint-ink);background:linear-gradient(140deg,var(--tint),var(--tint-2));box-shadow:0 10px 22px -10px var(--tint),inset 0 1px 0 rgba(255,255,255,.35)}
.pill.tint::before{content:"";position:absolute;inset:0 0 50% 0;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0))}
.pill:disabled{opacity:.6}
.pill.tint .spin{border-color:rgba(255,255,255,.35);border-top-color:#fff}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pager button{border-radius:20px;padding:12px 14px;text-align:right;min-width:0}
.pager small{display:block;color:var(--tint);font-size:.72em;font-weight:700}
.pager span{display:block;font-size:.86em;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pager .ghost{visibility:hidden}

.searchbar{display:flex;align-items:center;gap:8px;border-radius:16px;padding:2px 12px;position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:5}
.searchbar svg{width:18px;height:18px;color:var(--muted);flex:none}
.searchbar input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--fg);padding:11px 0;outline:none}
.searchbar input::placeholder{color:var(--muted)}
.seg{display:flex;gap:8px;overflow-x:auto;margin:12px -18px 0;padding:2px 18px 6px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border-radius:999px;padding:7px 14px;font-size:.8em;font-weight:700;color:var(--fg-2)}
.seg button[aria-pressed="true"]{color:#fff;background:linear-gradient(140deg,var(--tint),var(--tint-2));box-shadow:0 8px 18px -10px var(--tint)}
mark{background:var(--mark);color:inherit;border-radius:4px;padding:0 2px}
.snip{display:block;font-size:.78em;color:var(--muted);line-height:1.6;margin-top:2px}

.cell .ctl{display:flex;gap:6px;flex:none}
.step{width:40px;height:34px;border-radius:12px;font-weight:800;font-size:1.05em;background:color-mix(in srgb,var(--fg) 8%,transparent)}
.cell .act{color:var(--tint);font-weight:700;font-size:.88em;white-space:nowrap}
.about{border-radius:22px;padding:14px 16px;font-size:.84em;color:var(--muted);line-height:1.9}
.about b{color:var(--fg)}

.empty{text-align:center;color:var(--muted);padding:34px 20px;font-size:.9em;border-radius:22px}
.empty .big{font-size:2.4em;line-height:1;margin-bottom:8px;opacity:.85}

.tabbar{position:fixed;z-index:30;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(480px,calc(100% - 24px));
  border-radius:30px;padding:6px;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:var(--shadow-lg),inset 0 1px 0 rgba(255,255,255,.45)}
.tabbar .lens{position:absolute;top:6px;bottom:6px;width:calc((100% - 12px)/5);border-radius:24px;right:6px;
  background:color-mix(in srgb,var(--tint) 16%,transparent);transition:transform .55s var(--ease);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px 5px;font-size:.66em;font-weight:700;color:var(--muted);border-radius:24px}
.tabbar button svg{width:23px;height:23px;transition:transform .45s var(--ease)}
.tabbar button[aria-current="page"]{color:var(--tint)}
.tabbar button[aria-current="page"] svg{transform:translateY(-1px) scale(1.06)}

.toast{position:fixed;z-index:40;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-160%);border-radius:999px;padding:10px 18px;font-size:.84em;font-weight:700;
  max-width:calc(100% - 40px);display:flex;align-items:center;gap:8px;transition:transform .55s var(--ease)}
.toast.show{transform:translate(-50%,0)}
.toast .ok{width:20px;height:20px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;flex:none}
.toast .ok svg{width:12px;height:12px}
.spin{width:16px;height:16px;border:2px solid color-mix(in srgb,var(--fg) 18%,transparent);border-top-color:var(--tint);border-radius:50%;animation:sp .8s linear infinite;flex:none;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* plain-language explainer on a brain page */
.explain{border-radius:22px;padding:14px 16px;margin-bottom:4px}
.explain .q{font-size:.76em;font-weight:800;color:var(--tint);margin-bottom:2px}
.explain p{margin:0 0 10px;font-size:.92em;color:var(--fg-2);line-height:1.85}
.explain p:last-of-type{margin-bottom:8px}
.ex{display:flex;flex-wrap:wrap;gap:6px}
.ex button{font-size:.76em;border-radius:999px;padding:5px 12px;background:color-mix(in srgb,var(--tint) 11%,transparent);color:var(--tint);font-weight:700}
/* assistant entry on home */
.askcard{display:flex;align-items:center;gap:12px;border-radius:22px;padding:12px 14px;margin-top:12px;width:100%;text-align:right}
.askcard .av{width:42px;height:42px;border-radius:30%;display:grid;place-items:center;color:#fff;flex:none;background:linear-gradient(150deg,#64d2ff,#5e5ce6 60%,#bf5af2);box-shadow:0 8px 18px -8px #5e5ce6}
.askcard .av svg{width:22px;height:22px}
.askcard .t{display:block;font-weight:800;font-size:.95em}
.askcard .m{display:block;font-size:.76em;color:var(--muted)}
.askcard .chev{width:14px;height:14px;color:color-mix(in srgb,var(--muted) 70%,transparent);flex:none}
/* assistant chat */
.chat{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.msg{max-width:88%;border-radius:22px;padding:11px 15px;font-size:.92em;line-height:1.85}
.msg.bot{align-self:flex-start;border-end-start-radius:8px}
.msg.me{align-self:flex-end;border-end-end-radius:8px;color:#fff;background:linear-gradient(140deg,var(--tint),var(--tint-2));box-shadow:0 10px 22px -12px var(--tint)}
.msg p{margin:0 0 6px}.msg p:last-child{margin:0}
.msg .go{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.msg .go button{border-radius:999px;padding:7px 13px;font-size:.82em;font-weight:800;color:#fff;background:linear-gradient(140deg,var(--tint),var(--tint-2))}
.msg .go button.alt{background:color-mix(in srgb,var(--fg) 8%,transparent);color:var(--fg)}
.msg .mini{margin-top:10px;border-radius:16px;overflow:hidden;border:.5px solid var(--sep)}
.msg .mini .cell{padding:9px 12px;min-height:0}
.msg .mini .cell .ic{width:26px;height:26px;border-radius:8px;font-size:.78em}
.composer{position:sticky;bottom:calc(92px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;border-radius:26px;padding:5px 5px 5px 14px;margin-top:14px;z-index:5}
.composer input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--fg);padding:9px 12px;outline:none}
.composer input::placeholder{color:var(--muted)}
.composer button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,var(--tint),var(--tint-2));flex:none}
.composer button svg{width:19px;height:19px}
.goals{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.goals button{border-radius:999px;padding:8px 14px;font-size:.82em;font-weight:700}
.gloss{display:grid;gap:8px}
.gloss .cell .m{display:block}
/* first-run tour */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.28);display:flex;align-items:flex-end;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom));animation:fadeIn .3s ease both}
.sheet.glass{background:var(--glass-strong);-webkit-backdrop-filter:blur(40px) saturate(190%);backdrop-filter:blur(40px) saturate(190%)}
.scrim{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet{width:min(520px,100%);border-radius:30px;padding:22px 20px 16px;animation:sheetUp .55s var(--ease) both;max-height:88vh;overflow:auto}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:fadeIn .2s ease both}}
.sheet h2{font-size:1.45em;font-weight:800;letter-spacing:-.02em;margin:0 0 4px;text-align:center}
.sheet .lead{text-align:center;color:var(--muted);font-size:.88em;margin:0 0 16px}
.tour{display:flex;flex-direction:column;gap:12px}
.tour .st{display:flex;gap:12px;align-items:flex-start}
.tour .st .ic{width:44px;height:44px;border-radius:30%;display:grid;place-items:center;color:#fff;flex:none;position:relative;overflow:hidden;font-weight:800}
.tour .st .ic::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.4),rgba(255,255,255,0) 55%)}
.tour .st .ic svg{width:22px;height:22px;position:relative}
.tour .st b{display:block;font-size:.98em}
.tour .st span{font-size:.84em;color:var(--fg-2);line-height:1.75}
.tour .arrow{color:var(--muted);text-align:center;font-size:.8em;margin:-4px 0}
.sheet .pill.tint{width:100%;justify-content:center;margin-top:18px;padding:14px}
.writing{border-radius:22px;padding:14px 16px;margin-top:12px}
.writing .h{display:flex;align-items:center;gap:8px;font-size:.8em;font-weight:800;color:var(--tint)}
.writing .md{max-height:300px;overflow:auto;margin-top:8px;font-size:.9em}

<script>
(function(){
"use strict";
var FA="۰۱۲۳۴۵۶۷۸۹";
function fa(n){return String(n).replace(/\d/g,function(d){return FA[d];});}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function $(id){return document.getElementById(id);}

/* Lessons come from: APK -> window.Android bridge; web library -> window.MZ_SOURCE (live database); dev -> content.json beside this file. */
var NATIVE=!!window.Android, SRC=window.MZ_SOURCE||null;

function lsGet(k,d){try{var v=localStorage.getItem("mz."+k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem("mz."+k,JSON.stringify(v));}catch(e){}}
var READ=lsGet("read",{}), SAVED=lsGet("saved",{}), LAST=lsGet("last",null);
var FS=lsGet("fs",16);document.documentElement.style.setProperty("--fs",FS+"px");

var C={rev:0,updated:"",brains:[],lessons:[]}, BY={}, BRAIN={}, NEWSET={};
function index(){
  BY={};BRAIN={};
  C.brains.forEach(function(b){BRAIN[b.id]=b;BY[b.id]=[];});
  C.lessons.forEach(function(l){(BY[l.brain]=BY[l.brain]||[]).push(l);});
  var days=[];C.lessons.map(function(l){return l.date;}).filter(Boolean).sort().forEach(function(d){if(days[days.length-1]!==d)days.push(d);});
  var recent=days.slice(-2);NEWSET={};
  C.lessons.forEach(function(l){if(recent.indexOf(l.date)>=0&&!READ[l.id])NEWSET[l.id]=1;});
}
function setContent(c){if(c&&c.brains){C=c;index();}}
function loadContent(){
  if(SRC)return SRC.load().then(setContent);
  if(NATIVE){try{setContent(JSON.parse(window.Android.getContent()));}catch(e){}return Promise.resolve();}
  return fetch("content.json").then(function(r){return r.json();}).then(setContent).catch(function(){});
}
function lessonById(id){for(var i=0;i<C.lessons.length;i++)if(C.lessons[i].id===id)return C.lessons[i];return null;}
function foldersOf(bid){var f=((BRAIN[bid]&&BRAIN[bid].folders)||[]).slice();(BY[bid]||[]).forEach(function(l){if(f.indexOf(l.folder)<0)f.push(l.folder);});return f;}
function inFolder(bid,f){return (BY[bid]||[]).filter(function(l){return l.folder===f;});}
function readCount(a){return a.filter(function(l){return READ[l.id];}).length;}
function newCount(a){return a.filter(function(l){return NEWSET[l.id];}).length;}
function faDate(d){if(!d)return "";var p=d.split("-");return p.length===3?fa(+p[2]+" / "+(+p[1])):fa(d);}
function lighten(hex,amt){var n=parseInt(String(hex).slice(1),16);if(isNaN(n))return hex;var r=n>>16,g=n>>8&255,b=n&255;function f(v){return Math.round(v+(255-v)*amt);}return "rgb("+f(r)+","+f(g)+","+f(b)+")";}
function textColor(c){var n=parseInt(String(c).slice(1),16);if(isNaN(n))return "var(--tint)";var L=(.2126*(n>>16)+.7152*(n>>8&255)+.0722*(n&255))/255;return L<.28?"var(--muted)":c;}
var SHORT={security:"امنیت",automation:"اتوماسیون",it:"پشتیبانی IT"};
function shortName(b){return b.short||SHORT[b.id]||String(b.name).split(" (")[0];}
function iconBg(c){return "background:linear-gradient(155deg,"+lighten(c,.3)+","+c+" 70%);--c:"+c;}

function inl(s){
  return esc(s).replace(/`([^`]+)`/g,'<code class="inl">$1</code>').replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" data-ext="1">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" data-ext="1">$2</a>')
    .replace(/^\[ \]\s/,"☐ ").replace(/^\[x\]\s/i,"☑ ");
}
function md(src){
  var out="",parts=String(src||"").split("```");
  for(var k=0;k<parts.length;k++){
    var p=parts[k];
    if(k%2===1){var nl=p.indexOf("\n");var code=nl>=0?p.slice(nl+1):p;out+='<pre><button class="cp press" data-copycode>کپی</button><code>'+esc(code.replace(/\n$/,""))+"</code></pre>";continue;}
    var lines=p.split("\n"),para=[],list=null,lt="",tbl=[];
    var fP=function(){if(para.length){out+="<p>"+para.join("<br>")+"</p>";para=[];}};
    var fL=function(){if(list){out+="<"+lt+">"+list.map(function(x){return "<li>"+x+"</li>";}).join("")+"</"+lt+">";list=null;}};
    var fT=function(){if(tbl.length){var rows=tbl.filter(function(r){return !/^\s*\|?\s*:?-{2,}/.test(r);});var h='<div class="tbl"><table>';
      rows.forEach(function(r,i){var cs=r.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|");h+="<tr>"+cs.map(function(c){return (i?"<td>":"<th>")+inl(c.trim())+(i?"</td>":"</th>");}).join("")+"</tr>";});
      out+=h+"</table></div>";tbl=[];}};
    for(var i=0;i<lines.length;i++){
      var t=lines[i].trim(),m;
      if(/^\|.*\|$/.test(t)){fP();fL();tbl.push(t);continue;}else fT();
      if(!t){fP();fL();continue;}
      if((m=t.match(/^(#{1,6})\s+(.*)$/))){fP();fL();var lv=Math.min(5,Math.max(3,m[1].length+1));out+="<h"+lv+">"+inl(m[2])+"</h"+lv+">";continue;}
      if(/^(-{3,}|\*{3,})$/.test(t)){fP();fL();out+="<hr>";continue;}
      if((m=t.match(/^>\s?(.*)$/))){fP();fL();out+="<blockquote>"+inl(m[1])+"</blockquote>";continue;}
      if((m=t.match(/^[-*]\s+(.*)$/))){fP();if(lt!=="ul")fL();lt="ul";(list=list||[]).push(inl(m[1]));continue;}
      if((m=t.match(/^\d+[.)]\s+(.*)$/))){fP();if(lt!=="ol")fL();lt="ol";(list=list||[]).push(inl(m[1]));continue;}
      fL();para.push(inl(t));
    }
    fP();fL();fT();
  }
  return out;
}

function tokens(q){return norm(q).replace(/[؟?!.,،:;()«»"']/g," ").split(/\s+/).filter(function(t){return t.length>2&&STOP.indexOf(" "+t+" ")<0;});}
function hasWord(nq,k){k=norm(k);return nq.indexOf(" "+k)>=0;}
function askGuide(q){
  var nq=" "+norm(q).replace(/[؟?!.,،:;()«»"']/g," ").replace(/\s+/g," ")+" ",tk=tokens(q),bs={},fs={};
  C.brains.forEach(function(b){var g=GUIDE[b.id];var s=0;
    if(hasWord(nq,norm(b.name).split(" (")[0]))s+=6;if(b.en&&hasWord(nq,b.en))s+=6;
    if(g){g.k.forEach(function(k){if(hasWord(nq,k))s+=3;});
      Object.keys(g.f).forEach(function(f){var fsc=0;g.f[f][1].forEach(function(k){if(hasWord(nq,k))fsc+=4;});if(hasWord(nq,f))fsc+=5;if(fsc){fs[b.id+"|"+f]=fsc;s+=fsc;}});}
    if(s)bs[b.id]=s;});
  var ls=[];C.lessons.forEach(function(l){var s=0,nt=norm(l.title),nb=norm(l.body);tk.forEach(function(t){if(nt.indexOf(t)>=0)s+=3;else if(nb.indexOf(t)>=0)s+=1;});
    s+=(bs[l.brain]||0)*.4+(fs[l.brain+"|"+l.folder]||0)*.6;if(s>=2.5)ls.push({l:l,s:s});});
  ls.sort(function(a,b){return b.s-a.s;});
  var top=Object.keys(bs).sort(function(a,b){return bs[b]-bs[a];})[0]||(ls[0]&&ls[0].s>=6?ls[0].l.brain:null);
  var topF=null;if(top){var best=0;Object.keys(fs).forEach(function(k){var p=k.split("|");if(p[0]===top&&fs[k]>best){best=fs[k];topF=p[1];}});
    if(!topF&&ls[0]&&ls[0].l.brain===top)topF=ls[0].l.folder;}
  var alt=Object.keys(bs).sort(function(a,b){return bs[b]-bs[a];}).filter(function(x){return x!==top;}).slice(0,2);
  return {brain:top,folder:topF,lessons:ls.slice(0,4).map(function(x){return x.l;}),alt:alt};
}

  var hits=[];

    var s=0,nb=norm(l.body);if(norm(l.title).indexOf(nq)>=0)s+=10;if(norm(l.folder).indexOf(nq)>=0)s+=4;var at=nb.indexOf(nq);if(at>=0)s+=2;
    if(s){var snip="";if(at>=0){var raw=l.body.replace(/```[\s\S]*?```/g," ").replace(/[#*`>|]/g,"");var na=norm(raw).indexOf(nq);if(na>=0)snip=raw.slice(Math.max(0,na-36),na+nq.length+56).replace(/\s+/g," ");}hits.push({l:l,s:s,snip:snip});}});
  hits.sort(function(a,b){return b.s-a.s;});
  if(!hits.length)return '<div class="empty glass" style="margin-top:14px"><div class="big">🫥</div>چیزی پیدا نشد. کلمه‌ی کوتاه‌تر یا مترادف امتحان کن.</div>';

}

  if(d.unread){delete READ[d.unread];lsSet("read",READ);index();toast("علامت نخوانده خورد");return;}
  if(d.copylesson){var l=lessonById(d.copylesson);copy(l.title+"\n\n"+l.body+(l.source?"\n\nمنبع: "+l.source:""));return;}
  if("copycode" in d){var c=t.parentNode.querySelector("code");copy(c?c.textContent:"");return;}
  if(d.sb!==undefined){searchBrain=d.sb;var q=$("q");$("results").innerHTML=results(q?q.value:"");document.querySelectorAll("[data-sb]").forEach(function(c){c.setAttribute("aria-pressed",String(c.dataset.sb===searchBrain));});return;}
  if(d.fs){FS=Math.max(13,Math.min(22,FS+parseInt(d.fs,10)));lsSet("fs",FS);document.documentElement.style.setProperty("--fs",FS+"px");soft();return;}
  if("resetread" in d){READ={};lsSet("read",READ);index();toast("پیشرفت صفر شد");soft();return;}
  if(d.gen){generate(d.gen);return;}
  if(d.ask){ask(d.ask);return;}
  if(d.goal!==undefined){var gl=GOALS[+d.goal];CHAT.push({me:gl[0]});var an=askGuide(gl[0]);if(!an.brain||an.brain!==gl[1]){an.brain=gl[1];an.folder=gl[2];an.lessons=inFolder(gl[1],gl[2]).slice(0,4);an.alt=[];}CHAT.push({a:an});render(true);var ce=$("chatEnd");if(ce)ce.scrollIntoView({block:"end",behavior:"smooth"});return;}
  if("gloss" in d){CHAT.push({gloss:1});render(true);var ge=$("chatEnd");if(ge)ge.scrollIntoView({block:"end",behavior:"smooth"});return;}
  if("clearchat" in d){CHAT=[];render(true);return;}
  if("tour" in d){showTour();return;}
  if("closetour" in d){closeTour();return;}
  if(d.dl&&SRC&&SRC.download){SRC.download(d.dl,C).then(function(m){if(m)toast(m,true);});return;}
});
document.addEventListener("submit",function(e){if(e.target.id==="askForm"){e.preventDefault();var i=$("askq");var v=i?i.value:"";ask(v);}});
document.addEventListener("input",function(e){if(e.target.id==="q"){$("results").innerHTML=results(e.target.value);try{history.replaceState(null,"","#search/"+encodeURIComponent(e.target.value));}catch(x){}}});
function onScroll(){var nb=$("navbar"),big=document.querySelector(".large h1,.bhead h1,.article h1");var lim=big?big.getBoundingClientRect().bottom:0;nb.classList.toggle("solid",!big||lim<60);}
function copy(txt){
  if(NATIVE&&window.Android.copy){window.Android.copy(txt);toast("کپی شد",true);return;}
  try{navigator.clipboard.writeText(txt).then(function(){toast("کپی شد",true);},function(){toast("کپی نشد");});}catch(e){toast("کپی نشد");}
}
var tt;function toast(m,ok){var x=$("toast");x.innerHTML=(ok?'<span class="ok">'+IC.check+"</span>":"")+"<span>"+esc(m)+"</span>";x.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){x.classList.remove("show");},2600);}

loadContent().then(function(){prevDepth=depth(route());prevTab=tabOf(route());render(true);startUpdate(true);if(!lsGet("tour",0))showTour();});
})();
</script>
